<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oracle — 数字奇物柜</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --paper: #F5F1EB;
            --paper-dark: #E8E4DD;
            --ink: #1C1B1A;
            --ink-muted: #6B6966;
            --accent-purple: #9C27B0;
        }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--paper);
            color: var(--ink);
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: var(--ink-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .back-link:hover { color: var(--ink); }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 48px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header { margin-bottom: 32px; }

        .header-number {
            font-family: 'Playfair Display', serif;
            font-size: 13px;
            font-style: italic;
            color: var(--ink-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(36px, 8vw, 56px);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 0.95;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 14px;
            color: var(--ink-muted);
            line-height: 1.7;
        }

        .card-area {
            perspective: 1000px;
            margin-bottom: 32px;
            min-height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .oracle-card {
            width: 260px;
            height: 360px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .oracle-card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--ink);
            padding: 24px;
            box-shadow: 4px 4px 0 var(--ink);
        }

        .card-front {
            background: var(--accent-purple);
            color: white;
        }

        .card-front-symbol {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.9;
        }

        .card-front-symbol svg {
            width: 100%;
            height: 100%;
        }

        .card-front-text {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-style: italic;
            letter-spacing: 2px;
        }

        .card-back {
            background: white;
            transform: rotateY(180deg);
            justify-content: flex-start;
            padding: 32px 24px;
        }

        .card-back-symbol {
            font-size: 48px;
            margin-bottom: 16px;
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            color: var(--accent-purple);
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-back-symbol svg {
            width: 100%;
            height: 100%;
        }

        .card-back-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .card-back-text {
            font-size: 15px;
            line-height: 1.8;
            color: var(--ink-muted);
        }

        .card-back-hint {
            margin-top: auto;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ink-muted);
        }

        .draw-btn {
            padding: 14px 32px;
            background: var(--ink);
            color: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 3px 3px 0 var(--ink-muted);
        }

        .draw-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--ink-muted);
        }

        .draw-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 var(--ink-muted);
        }

        .draw-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .history {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--paper-dark);
        }

        .history-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ink-muted);
            margin-bottom: 16px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            background: white;
            border: 1.5px solid var(--ink);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            box-shadow: 2px 2px 0 var(--ink);
        }

        .history-item-title {
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .history-item-text {
            color: var(--ink-muted);
            font-size: 12px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <a href="curio.html" class="back-link">← 返回奇物柜</a>
    
    <div class="container">
        <div class="header">
            <div class="header-number">Curio 02</div>
            <h1>Oracle</h1>
            <p>点击卡牌，抽取一句只属于此刻的谶语。</p>
        </div>

        <div class="card-area">
            <div class="oracle-card" id="oracleCard" onclick="drawCard()">
                <div class="card-face card-front">
                    <div class="card-front-symbol">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"/>
                            <circle cx="12" cy="12" r="4" fill="white" stroke="none" opacity="0.4"/>
                            <circle cx="12" cy="19" r="1.5" fill="white" stroke="none"/>
                        </svg>
                    </div>
                    <div class="card-front-text">CLICK TO DRAW</div>
                </div>
                <div class="card-face card-back" id="cardBack">
                    <div class="card-back-symbol" id="cardSymbol">?</div>
                    <div class="card-back-title" id="cardTitle">--</div>
                    <div class="card-back-text" id="cardText">--</div>
                    <div class="card-back-hint">再次点击重抽</div>
                </div>
            </div>
        </div>

        <button class="draw-btn" id="drawBtn" onclick="drawCard()">抽取卡牌</button>

        <div class="history" id="history" style="display: none;">
            <div class="history-title">今日已抽</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        const fortunes = [
            { symbol: '潮', title: '潮汐', text: '有些事像潮水，退去之后才会留下真正的痕迹。你现在正站在岸边。', pattern: 'wave' },
            { symbol: '烛', title: '烛火', text: '你不需要照亮整片黑暗，只需要让自己这团火，烧得再稳一点。', pattern: 'flame' },
            { symbol: '落', title: '落叶', text: '不是所有的离开都需要理由。有时候，风一吹，你就该走了。', pattern: 'leaf' },
            { symbol: '石', title: '石头', text: '你心里有一块很久没动过的石头。它不重，但你也一直没想好怎么处理。', pattern: 'stone' },
            { symbol: '雾', title: '雾', text: '看不清的时候，先别急着走。雾里也有路，只是你看不见。', pattern: 'cloud' },
            { symbol: '沙', title: '沙漏', text: '你以为时间还很多，但事实上，某些窗口正在悄悄关闭。', pattern: 'hourglass' },
            { symbol: '镜', title: '镜子', text: '你最近在回避某种自我认知。镜子里那个人，其实你挺熟的。', pattern: 'mirror' },
            { symbol: '种', title: '种子', text: '有些东西已经在你身体里发芽了。你还没注意到，但它已经长出了第一片叶子。', pattern: 'seed' },
            { symbol: '梯', title: '梯子', text: '你正在往上爬，但忘了抬头看看自己已经走了多远。', pattern: 'ladder' },
            { symbol: '月', title: '月相', text: '你正在经历一个"不完整"的阶段。但正是这种不完整，让你更真实。', pattern: 'moon' },
            { symbol: '窗', title: '窗户', text: '有一扇窗你一直没推开。外面不是什么宝藏，只是你需要一点新鲜空气。', pattern: 'window' },
            { symbol: '烬', title: '余烬', text: '曾经燃烧过的东西，不会完全熄灭。你只是在等一阵风。', pattern: 'ember' },
            { symbol: '轨', title: '轨道', text: '你不需要和别人走同一条路。每个人都有自己的引力系统。', pattern: 'orbit' },
            { symbol: '向', title: '指南针', text: '你最近有点迷路，但指南针没坏。它只是在等你想清楚要去哪。', pattern: 'compass' },
            { symbol: '泡', title: '气泡', text: '有些想法就像气泡，看起来很脆弱，但其实它们承载着比你以为的更重要的东西。', pattern: 'bubble' },
            { symbol: '砖', title: '砖块', text: '你最近在搭建什么，虽然你自己还没意识到那是一座墙还是一座桥。', pattern: 'brick' },
            { symbol: '缝', title: '针线', text: '有些关系正在被悄悄缝补。也许你还没察觉，但它在变好。', pattern: 'thread' },
            { symbol: '轮', title: '年轮', text: '你最近的一个决定，会在很久之后才显现它的形状。现在不用急。', pattern: 'ring' },
        ];

        const card = document.getElementById('oracleCard');
        const cardBack = document.getElementById('cardBack');
        const cardSymbol = document.getElementById('cardSymbol');
        const cardTitle = document.getElementById('cardTitle');
        const cardText = document.getElementById('cardText');
        const drawBtn = document.getElementById('drawBtn');
        const historyDiv = document.getElementById('history');
        const historyList = document.getElementById('historyList');
        
        let isFlipped = false;
        let currentFortune = null;
        
        // 从 localStorage 读取今日历史
        function getTodayKey() {
            const now = new Date();
            return `oracle_${now.getFullYear()}_${now.getMonth()}_${now.getDate()}`;
        }
        
        function getHistory() {
            const key = getTodayKey();
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : [];
        }
        
        function saveHistory(fortune) {
            const key = getTodayKey();
            const history = getHistory();
            history.unshift({ ...fortune, time: new Date().toLocaleTimeString() });
            localStorage.setItem(key, JSON.stringify(history.slice(0, 10)));
            renderHistory();
        }
        
        function renderHistory() {
            const history = getHistory();
            if (history.length === 0) {
                historyDiv.style.display = 'none';
                return;
            }
            historyDiv.style.display = 'block';
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-item-title">${item.title} · ${item.time}</div>
                    <div class="history-item-text">${item.text}</div>
                </div>
            `).join('');
        }

        function getOracleSymbol(pattern) {
        const svgs = {
            wave: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9 C5 5 8 5 11 9 C14 13 17 13 20 9"/><path d="M3 15 C6 11 9 11 12 15 C15 19 18 19 21 15"/></svg>',
            flame: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11 H15 V20 C15 21 14 22 13 22 H11 C10 22 9 21 9 20 Z"/><path d="M9 11 C9 9.5 10 10 10.5 11 M15 11 C15 9.5 14 10 13.5 11" stroke-width="1.3"/><path d="M12 11 V8.5"/><path d="M12 8.5 C10.2 6.8 10.5 3.5 12 2.5 C13.5 3.5 13.8 6.8 12 8.5 Z"/><path d="M12 7.3 C11.3 6.2 11.5 4.6 12 4 C12.5 4.6 12.7 6.2 12 7.3 Z" fill="var(--accent-purple)" stroke="none" opacity="0.45"/></svg>',
            leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 C5 19 6 8 15 5 C17 13 13 19 5 19 Z"/><path d="M6.5 17.5 C10 13 12.5 9 14.5 6.5"/><path d="M5 19 L3.5 21"/><path d="M9 15 L7.5 16 M11.5 12 L10 13 M13.5 9.5 L12 10.5" stroke-width="1.2" opacity="0.55"/></svg>',
            stone: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13 L8 8 L13 7 L18 10 L20 15 L16 20 L10 20 L5 17 Z"/><path d="M8 8 L11 13 L18 10" stroke-width="1.3" opacity="0.55"/><path d="M10 20 L12 15 L16 20" stroke-width="1.3" opacity="0.55"/></svg>',
            cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13 C4 13 4 9 7 9 C7 5 13 5 14 8 C17 6 20 9 19 12 C21 12 21 14 19 14 Z"/><path d="M6 18 H10 M12 18 H16 M9 21 H14" stroke-width="1.4" opacity="0.7"/></svg>',
            hourglass: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 H17 L12 12 Z"/><path d="M7 20 H17 L12 12 Z"/><path d="M6 4 H18 M6 20 H18"/><path d="M12 12 V16" stroke-width="1.3"/><path d="M10 18 H14" stroke-width="1.3"/></svg>',
            mirror: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="8.5" rx="6" ry="6.5"/><path d="M12 15 V20"/><path d="M9.5 20 H14.5"/><path d="M9 6 C10 4.5 12 5 12.5 7" stroke-width="1.3" opacity="0.55"/></svg>',
            seed: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20 C9 20 8 16 9 12.5 C10 10.5 12 10.5 12 10.5 C12 10.5 14 10.5 15 12.5 C16 16 15 20 12 20 Z"/><path d="M12 10.5 V4.5"/><path d="M12 7.5 C10 6.5 9 4.5 9 3.5 M12 7.5 C14 6.5 15 4.5 15 3.5" stroke-width="1.3"/></svg>',
            ladder: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 V21 M16 3 V21 M8 7 H16 M8 11 H16 M8 15 H16 M8 19 H16"/></svg>',
            moon: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4 C11 4 7 9 7 14 C7 19 11 21 16 20 C12 18 12 9 16 4 Z"/><circle cx="17.5" cy="8" r="0.8" fill="var(--accent-purple)" stroke="none"/><circle cx="16" cy="13" r="0.6" fill="var(--accent-purple)" stroke="none"/></svg>',
            window: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="14" rx="1.5"/><path d="M12 4 V18 M5 11 H19"/><path d="M4 18 H20"/></svg>',
            ember: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16 C3.5 13.5 6.5 12 8.5 13.5 C10 14.5 9.5 17.5 7.5 18 C5.5 18.5 4.5 18 4 16 Z"/><path d="M13.5 17 C13 15 15 13.5 17 14 C19 14.5 19 17.5 17 18 C15 18.5 14 18.5 13.5 17 Z"/><circle cx="6.5" cy="15" r="1" fill="var(--accent-purple)" stroke="none"/><circle cx="16" cy="16" r="0.9" fill="var(--accent-purple)" stroke="none"/><path d="M9.5 11 L9.5 8 M9.5 8 L8.5 6.5 M9.5 8 L10.5 6.5" stroke-width="1.2"/><circle cx="12.5" cy="6" r="0.7" fill="var(--accent-purple)" stroke="none"/><circle cx="14.5" cy="9.5" r="0.6" fill="var(--accent-purple)" stroke="none"/></svg>',
            orbit: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9.5" ry="4" transform="rotate(-22 12 12)"/><circle cx="12" cy="12" r="2.2"/><circle cx="19.5" cy="8" r="1.6" fill="var(--accent-purple)" stroke="none"/></svg>',
            compass: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 5 L14.5 12 L12 11 Z" fill="var(--accent-purple)" stroke="none"/><path d="M12 19 L9.5 12 L12 13 Z" fill="var(--accent-purple)" stroke="none" opacity="0.5"/><circle cx="12" cy="12" r="1.1" fill="white" stroke="none"/></svg>',
            bubble: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="13" r="7.5"/><path d="M7.5 10 A5.5 5.5 0 0 1 13 7.5" stroke-width="1.3" opacity="0.55"/><circle cx="8.5" cy="10.5" r="1.3" fill="var(--accent-purple)" stroke="none" opacity="0.5"/><circle cx="19.5" cy="6.5" r="2"/><circle cx="20.5" cy="16.5" r="1.3"/></svg>',
            brick: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6 H20 V18 H4 Z"/><path d="M4 12 H20 M9 6 V12 M15 12 V18"/></svg>',
            thread: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 L16 5"/><circle cx="16" cy="5" r="1.6"/><path d="M16 5 C18.5 6.5 18 9.5 15.5 10.5" stroke-width="1.3"/><path d="M5 19 L8 16 M10 17.5 L13 14.5 M15 12.5 L17 10.5" stroke-width="1.3" opacity="0.6"/></svg>',
            ring: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="3"/><path d="M12 3 V12" stroke-width="1.3" opacity="0.6"/></svg>'
        };
            return svgs[pattern] || svgs.mirror;
        }

        function drawCard() {
            if (isFlipped) {
                // 重置
                card.classList.remove('flipped');
                isFlipped = false;
                drawBtn.textContent = '抽取卡牌';
                setTimeout(() => {
                    currentFortune = null;
                }, 800);
                return;
            }
            
            // 随机抽取
            const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
            currentFortune = fortune;
            
            // 更新背面内容
            cardSymbol.innerHTML = getOracleSymbol(fortune.pattern);
            cardTitle.textContent = fortune.title;
            cardText.textContent = fortune.text;
            
            // 翻转
            card.classList.add('flipped');
            isFlipped = true;
            drawBtn.textContent = '再抽一次';
            
            // 保存到历史
            saveHistory(fortune);
        }
        
        // 初始化历史
        renderHistory();
    </script>
</body>
</html>
