<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eternal Clock — 数字奇物柜</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --paper: #F5F1EB;
            --paper-dark: #E8E4DD;
            --ink: #1C1B1A;
            --ink-muted: #6B6966;
        }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--paper);
            color: var(--ink);
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: var(--ink-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .back-link:hover { color: var(--ink); }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            text-align: center;
        }

        .header { margin-bottom: 40px; }

        .header-number {
            font-family: 'Playfair Display', serif;
            font-size: 13px;
            font-style: italic;
            color: var(--ink-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(36px, 8vw, 56px);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 0.95;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .clock-face {
            background: white;
            border: 2px solid var(--ink);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 6px 6px 0 var(--ink);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .clock-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--ink-muted);
            margin-bottom: 24px;
        }

        /* 秒模式 */
        .clock-time {
            font-family: 'Playfair Display', serif;
            font-size: clamp(64px, 18vw, 120px);
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 1;
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        .clock-unit {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--ink-muted);
            margin-bottom: 32px;
        }

        /* 呼吸模式 */
        .breath-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .breath-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--ink);
            margin-bottom: 24px;
            box-shadow: 0 0 0 rgba(28, 27, 26, 0);
            transform: scale(0.85);
            opacity: 0.5;
        }

        .breath-circle.animating {
            animation: breathe 6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { 
                transform: scale(0.85); 
                opacity: 0.5;
                box-shadow: 0 0 0 rgba(28, 27, 26, 0);
            }
            50% { 
                transform: scale(1.4); 
                opacity: 1;
                box-shadow: 0 0 40px rgba(28, 27, 26, 0.25);
            }
        }

        .breath-text {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
            transition: opacity 0.3s;
        }

        .breath-sub {
            font-size: 12px;
            color: var(--ink-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .breath-dots {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
        }

        .breath-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ink-muted);
            opacity: 0.2;
            transition: all 0.3s;
        }

        .breath-dot.active {
            opacity: 1;
            background: var(--ink);
            transform: scale(1.4);
        }

        /* 眨眼模式 */
        .blink-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .blink-face {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid var(--ink);
            position: relative;
            overflow: hidden;
            background: white;
            transition: transform 0.1s;
        }

        .blink-face.animating {
            animation: blink-face 2.5s ease-in-out infinite;
        }

        @keyframes blink-face {
            0%, 35%, 65%, 100% { transform: scaleY(1); }
            40%, 60% { transform: scaleY(0.9); }
            45%, 55% { transform: scaleY(0.85); }
        }

        .blink-face.animating .blink-eye {
            animation: blink-eyes 2.5s ease-in-out infinite;
        }

        .blink-face.animating .blink-mouth {
            animation: blink-mouth 2.5s ease-in-out infinite;
        }

        @keyframes blink-eyes {
            0%, 35%, 65%, 100% {
                height: 22px;
                top: 32px;
                border-radius: 50%;
            }
            40%, 60% {
                height: 3px;
                top: 42px;
                border-radius: 2px;
            }
        }

        @keyframes blink-mouth {
            0%, 35%, 65%, 100% {
                width: 36px;
                height: 18px;
                bottom: 26px;
            }
            40%, 60% {
                width: 28px;
                height: 10px;
                bottom: 30px;
            }
        }

        .blink-eye {
            position: absolute;
            top: 32px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--ink);
        }

        .blink-eye.left { left: 26px; }
        .blink-eye.right { right: 26px; }

        .blink-mouth {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 18px;
            border-radius: 0 0 40px 40px;
            background: transparent;
            border: 2px solid var(--ink);
            border-top: none;
        }

        .blink-text {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 900;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        .blink-sub {
            font-size: 12px;
            color: var(--ink-muted);
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .clock-meta {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--paper-dark);
        }

        .meta-item {
            text-align: center;
        }

        .meta-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ink-muted);
            margin-bottom: 4px;
        }

        .meta-value {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--ink);
        }

        .mode-toggle {
            display: inline-flex;
            gap: 8px;
            margin-top: 20px;
        }

        .mode-btn {
            padding: 10px 20px;
            background: white;
            border: 2px solid var(--ink);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            box-shadow: 2px 2px 0 var(--ink);
        }

        .mode-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .mode-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--ink);
        }

        .mode-btn.active {
            background: var(--ink);
            color: white;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <a href="curio.html" class="back-link">← 返回奇物柜</a>
    
    <div class="container">
        <div class="header">
            <div class="header-number">Curio 01</div>
            <h1>Eternal Clock</h1>
        </div>

        <div class="clock-face">
            <!-- 秒模式 -->
            <div id="secondsView" style="width: 100%;">
                <div class="clock-label">此刻的秒数</div>
                <div class="clock-time" id="clockDisplay">000000</div>
                <div class="clock-unit">秒</div>
            </div>

            <!-- 呼吸模式 -->
            <div id="breathsView" class="breath-container">
                <div class="breath-circle" id="breathCircle"></div>
                <div class="breath-text" id="breathText">吸气</div>
                <div class="breath-sub">跟随这个节奏</div>
                <div class="breath-dots" id="breathDots"></div>
            </div>

            <!-- 眨眼模式 -->
            <div id="blinksView" class="blink-container">
                <div class="blink-face" id="blinkFace">
                    <div class="blink-eye left"></div>
                    <div class="blink-eye right"></div>
                    <div class="blink-mouth"></div>
                </div>
                <div class="blink-text" id="blinkText">眨眼</div>
                <div class="blink-sub">和它一起眨眨眼</div>
            </div>

            <div class="clock-meta">
                <div class="meta-item">
                    <div class="meta-label">今日分钟</div>
                    <div class="meta-value" id="minuteCount">0</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">此刻</div>
                    <div class="meta-value" id="nowTime">--:--</div>
                </div>
            </div>
        </div>

        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="seconds" onclick="setMode('seconds')">秒</button>
            <button class="mode-btn" data-mode="breaths" onclick="setMode('breaths')">呼吸</button>
            <button class="mode-btn" data-mode="blinks" onclick="setMode('blinks')">眨眼</button>
        </div>
    </div>

    <script>
        const clockDisplay = document.getElementById('clockDisplay');
        const minuteCount = document.getElementById('minuteCount');
        const nowTime = document.getElementById('nowTime');
        const secondsView = document.getElementById('secondsView');
        const breathsView = document.getElementById('breathsView');
        const blinksView = document.getElementById('blinksView');
        const breathCircle = document.getElementById('breathCircle');
        const breathText = document.getElementById('breathText');
        const breathDots = document.getElementById('breathDots');
        const blinkFace = document.getElementById('blinkFace');
        const blinkText = document.getElementById('blinkText');
        
        let mode = 'seconds';
        let lastSecond = -1;
        let breathInterval = null;
        let blinkInterval = null;
        
        // 创建呼吸指示点
        const BREATH_DOTS = 12;
        for (let i = 0; i < BREATH_DOTS; i++) {
            const dot = document.createElement('div');
            dot.className = 'breath-dot';
            breathDots.appendChild(dot);
        }
        const dots = document.querySelectorAll('.breath-dot');
        
        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === newMode);
            });
            
            // 切换视图
            secondsView.style.display = newMode === 'seconds' ? 'block' : 'none';
            breathsView.style.display = newMode === 'breaths' ? 'flex' : 'none';
            blinksView.style.display = newMode === 'blinks' ? 'flex' : 'none';
            
            // 清理旧定时器
            if (breathInterval) clearInterval(breathInterval);
            if (blinkInterval) clearInterval(blinkInterval);
            
            // 停止所有动画
            breathCircle.classList.remove('animating');
            blinkFace.classList.remove('animating');
            
            // 启动新模式
            if (newMode === 'breaths') startBreathMode();
            if (newMode === 'blinks') startBlinkMode();
        }
        
        function startBreathMode() {
            breathCircle.classList.add('animating');
            breathText.textContent = '呼气';
            
            // 立即更新呼吸点
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === 6);
            });
            
            let inhale = false;
            breathInterval = setInterval(() => {
                inhale = !inhale;
                breathText.textContent = inhale ? '吸气' : '呼气';
                
                const activeIndex = inhale ? 0 : 6;
                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === activeIndex);
                });
            }, 3000);
        }
        
        function startBlinkMode() {
            blinkFace.classList.add('animating');
            blinkText.textContent = '眨眼';
            
            let closed = true;
            blinkInterval = setInterval(() => {
                closed = !closed;
                blinkText.textContent = closed ? '眨眼' : '睁开';
            }, 2500);
        }
        
        function updateClock() {
            const now = new Date();
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();
            
            const totalSeconds = Math.floor(now.getTime() / 1000);
            clockDisplay.textContent = String(totalSeconds).padStart(6, '0');
            nowTime.textContent = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;
            
            if (seconds !== lastSecond) {
                lastSecond = seconds;
                const totalMinutes = Math.floor(now.getTime() / 60000);
                minuteCount.textContent = totalMinutes;
            }
            
            requestAnimationFrame(updateClock);
        }
        
        updateClock();
    </script>
</body>
</html>
