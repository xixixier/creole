<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Season Sense — 数字奇物柜</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --paper: #F5F1EB;
            --paper-dark: #E8E4DD;
            --ink: #1C1B1A;
            --ink-muted: #6B6966;
        }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--paper);
            color: var(--ink);
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: var(--ink-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .back-link:hover { color: var(--ink); }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 48px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header { margin-bottom: 32px; }

        .header-number {
            font-family: 'Playfair Display', serif;
            font-size: 13px;
            font-style: italic;
            color: var(--ink-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(36px, 8vw, 56px);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 0.95;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 14px;
            color: var(--ink-muted);
            line-height: 1.7;
        }

        .season-card {
            background: white;
            border: 2px solid var(--ink);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 6px 6px 0 var(--ink);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .season-visual {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--ink);
            background: white;
        }

        .season-visual svg {
            width: 48px;
            height: 48px;
        }

        .season-name {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .season-date {
            font-size: 12px;
            color: var(--ink-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .season-desc {
            font-size: 15px;
            line-height: 1.8;
            color: var(--ink);
            margin-bottom: 20px;
        }

        .season-sensory {
            background: var(--paper);
            border-radius: 12px;
            padding: 16px;
            text-align: left;
        }

        .sensory-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ink-muted);
            margin-bottom: 8px;
        }

        .sensory-text {
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink);
        }

        .season-temp {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--paper-dark);
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .temp-item {
            text-align: center;
        }

        .temp-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ink-muted);
            margin-bottom: 4px;
        }

        .temp-value {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 900;
        }

        .change-btn {
            padding: 12px 28px;
            background: white;
            border: 2px solid var(--ink);
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 3px 3px 0 var(--ink);
        }

        .change-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .change-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 var(--ink);
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            opacity: 0.3;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <a href="curio.html" class="back-link">← 返回奇物柜</a>
    
    <div class="container">
        <div class="header">
            <div class="header-number">Curio 05</div>
            <h1>Season Sense</h1>
            <p>感受此刻的季节。不是日历上的季节，是空气、光线和温度告诉你的。</p>
        </div>

        <div class="season-card">
            <div class="season-visual" id="seasonVisual"></div>
            <div class="season-name" id="seasonName">--</div>
            <div class="season-date" id="seasonDate">--</div>
            <div class="season-desc" id="seasonDesc">--</div>
            
            <div class="season-sensory">
                <div class="sensory-label">此刻的感知</div>
                <div class="sensory-text" id="sensoryText">--</div>
            </div>

            <div class="season-temp">
                <div class="temp-item">
                    <div class="temp-label">体感温度</div>
                    <div class="temp-value" id="tempValue">--°</div>
                </div>
                <div class="temp-item">
                    <div class="temp-label">湿度</div>
                    <div class="temp-value" id="humidityValue">--%</div>
                </div>
                <div class="temp-item">
                    <div class="temp-label">风力</div>
                    <div class="temp-value" id="windValue">--</div>
                </div>
            </div>
        </div>

        <button class="change-btn" onclick="randomSeason()">换一种感觉</button>
    </div>

    <script>
        const seasons = [
            {
                name: '春分',
                visual: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 C12 3 8 7 8 12 C8 17 12 21 12 21 C12 21 16 17 16 12 C16 7 12 3 12 3 Z"/><path d="M12 3 L12 12"/><path d="M12 12 L12 21"/><path d="M10 7 L14 7"/></svg>',
                desc: '万物开始松动。空气里有泥土和花苞的味道，风还是凉的，但阳光已经开始变得温柔。',
                sensory: '你感受到一种"正在发生"的感觉。不是明确的行动，而是某种蠢蠢欲动。',
                temp: '18°',
                humidity: '65%',
                wind: '微风',
                particle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2.2"/><path d="M12 2 L12 6 M12 18 L12 22 M2 12 L6 12 M18 12 L22 12"/></svg>',
                particleColor: '#F8BBD9'
            },
            {
                name: '夏至',
                visual: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2 L12 6.5"/><path d="M12 17.5 L12 22"/><path d="M2 12 L6.5 12"/><path d="M17.5 12 L22 12"/><path d="M5.2 5.2 L8.2 8.2"/><path d="M15.8 15.8 L18.8 18.8"/><path d="M5.2 18.8 L8.2 15.8"/><path d="M15.8 8.2 L18.8 5.2"/></svg>',
                desc: '阳光直射下来，影子缩成一团。空气里有晒过的味道，蝉鸣震耳欲聋，但你不想打断它们。',
                sensory: '你感受到一种"被充满"的感觉。阳光、汗水、冰镇饮料，所有感官都开着。',
                temp: '32°',
                humidity: '78%',
                wind: '无风',
                particle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2 L12 6.5 M12 17.5 L12 22 M2 12 L6.5 12 M17.5 12 L22 12"/></svg>',
                particleColor: '#FFD54F'
            },
            {
                name: '秋分',
                visual: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 C12 2 6 6 6 12 C6 18 12 22 12 22 C12 22 18 18 18 12 C18 6 12 2 12 2 Z"/><path d="M12 2 L12 10"/><path d="M12 14 L12 22"/><path d="M10 6 L14 6"/></svg>',
                desc: '天空突然变高了。云走得很快，叶子开始变色，空气里有一种干燥的、类似书页的味道。',
                sensory: '你感受到一种"整理"的冲动。想收拾房间，想断舍离，想把一切归位。',
                temp: '22°',
                humidity: '45%',
                wind: '清风',
                particle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 Q8 8 12 12 Q16 16 12 22"/></svg>',
                particleColor: '#FF8A65'
            },
            {
                name: '冬至',
                visual: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L12 22"/><path d="M2 12 L22 12"/><path d="M5 5 L19 19"/><path d="M19 5 L5 19"/><circle cx="12" cy="12" r="2.5"/></svg>',
                desc: '昼最短，夜最长。空气很干净，呼出的气变成白雾。世界安静了，连鸟叫都少了。',
                sensory: '你感受到一种"向内"的倾向。想待在家里，想读一本厚书，想吃热的东西。',
                temp: '-2°',
                humidity: '30%',
                wind: '干冷',
                particle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 L12 6.5 M12 10 L12 13.5 M12 17.5 L12 22 M2 12 L6.5 12 M17.5 12 L22 12"/></svg>',
                particleColor: '#B3E5FC'
            },
            {
                name: '梅雨季',
                visual: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11 C7 7 11 5 14 5 C17 5 21 8 21 11 C21 15 17 17 14 17 C11 17 7 15 7 11 Z"/><path d="M10.5 18.5 L10.5 21"/><path d="M14 18.5 L14 21"/><path d="M17.5 18 L17.5 21"/><circle cx="10.5" cy="21" r="0.8" fill="var(--ink)" stroke="none"/><circle cx="14" cy="21" r="0.8" fill="var(--ink)" stroke="none"/><circle cx="17.5" cy="21" r="0.8" fill="var(--ink)" stroke="none"/></svg>',
                desc: '天是灰的，地是湿的。衣服晾不干，墙壁在渗水，但你莫名觉得很安心。',
                sensory: '你感受到一种"被包裹"的感觉。像裹在毯子里，不想出门，但也不焦虑。',
                temp: '26°',
                humidity: '92%',
                wind: '潮湿',
                particle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 Q8 8 12 10 Q16 12 12 18"/></svg>',
                particleColor: '#90CAF9'
            },
            {
                name: '台风天',
                visual: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6 C9 6 7.5 8.5 7.5 11 C7.5 13.5 9.5 16 12 16"/><path d="M12 6 C15 6 16.5 8.5 16.5 11 C16.5 13.5 14.5 16 12 16"/><path d="M12 6 L12 16"/><path d="M9 8.5 L15 13.5"/><path d="M15 8.5 L9 13.5"/><path d="M6 11 L6 13.5"/><path d="M18 11 L18 13.5"/></svg>',
                desc: '风在尖叫，窗在震动。你待在室内，听着外面的世界在狂欢，而你是安全的旁观者。',
                sensory: '你感受到一种"边界感"。室内外是两个世界，而你恰好待在安全的那一边。',
                temp: '28°',
                humidity: '85%',
                wind: '狂风',
                particle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 Q18 8 12 12 Q6 16 12 22"/></svg>',
                particleColor: '#78909C'
            }
        ];

        const seasonName = document.getElementById('seasonName');
        const seasonDate = document.getElementById('seasonDate');
        const seasonDesc = document.getElementById('seasonDesc');
        const sensoryText = document.getElementById('sensoryText');
        const tempValue = document.getElementById('tempValue');
        const humidityValue = document.getElementById('humidityValue');
        const windValue = document.getElementById('windValue');
        const seasonVisual = document.getElementById('seasonVisual');
        const particlesContainer = document.getElementById('particles');
        
        function createParticle(svgCode, color) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.innerHTML = svgCode;
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (8 + Math.random() * 12) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.color = color;
            particlesContainer.appendChild(particle);
            
            setTimeout(() => particle.remove(), 20000);
        }
        
        function spawnParticles(svgCode, color, count = 15) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => createParticle(svgCode, color), i * 300);
            }
        }
        
        function clearParticles() {
            particlesContainer.innerHTML = '';
        }
        
        function randomSeason() {
            const season = seasons[Math.floor(Math.random() * seasons.length)];
            
            seasonName.textContent = season.name;
            seasonDate.textContent = new Date().toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            seasonDesc.textContent = season.desc;
            sensoryText.textContent = season.sensory;
            tempValue.textContent = season.temp;
            humidityValue.textContent = season.humidity;
            windValue.textContent = season.wind;
            seasonVisual.innerHTML = season.visual;
            
            clearParticles();
            spawnParticles(season.particle, season.particleColor);
        }
        
        // 初始化
        randomSeason();
        
        // 持续生成粒子
        setInterval(() => {
            const currentVisual = seasonVisual.textContent;
            const season = seasons.find(s => s.visual === currentVisual);
            if (season && particlesContainer.children.length < 20) {
                createParticle(season.particle, season.particleColor);
            }
        }, 2000);
    </script>
</body>
</html>
