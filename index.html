<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creole 的异想小站</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --paper: #F5F1EB;
            --paper-dark: #E8E4DD;
            --ink: #1C1B1A;
            --ink-muted: #6B6966;
            --accent-pink: #E91E63;
            --accent-blue: #2196F3;
            --accent-green: #4CAF50;
            --accent-orange: #FF9800;
            --accent-purple: #9C27B0;
            --accent-yellow: #FDD835;
        }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--paper);
            color: var(--ink);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        .header {
            padding: 100px 0 80px;
            text-align: center;
            position: relative;
        }

        .header-number {
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            font-style: italic;
            color: var(--ink-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(48px, 10vw, 120px);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -3px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .header-subtitle {
            font-size: 16px;
            color: var(--ink-muted);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.7;
            font-weight: 400;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: var(--ink);
            margin: 40px auto;
        }

        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
            gap: 32px;
            padding: 40px 0 100px;
        }

        .chapter-card {
            position: relative;
            background: white;
            border: 2px solid var(--ink);
            border-radius: 16px;
            padding: 32px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                4px 4px 0 var(--ink),
                8px 8px 0 rgba(0,0,0,0.05);
        }

        .chapter-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 
                6px 6px 0 var(--ink),
                12px 12px 0 rgba(0,0,0,0.08);
        }

        .chapter-card:active {
            transform: translate(2px, 2px);
            box-shadow: 
                2px 2px 0 var(--ink),
                4px 4px 0 rgba(0,0,0,0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .card-number {
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            font-style: italic;
            color: var(--ink-muted);
            letter-spacing: 2px;
        }

        .card-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2.5px solid var(--ink);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card-icon svg {
            width: 30px;
            height: 30px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .card-desc {
            font-size: 15px;
            color: var(--ink-muted);
            line-height: 1.7;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--paper-dark);
        }

        .card-tag {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ink-muted);
        }

        .card-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s;
        }

        .chapter-card:hover .card-arrow {
            background: var(--ink);
            color: white;
            transform: rotate(-45deg);
        }

        .chapter-card:nth-child(1) .card-icon { background: var(--accent-pink); }
        .chapter-card:nth-child(2) .card-icon { background: var(--accent-purple); }

        .footer {
            text-align: center;
            padding: 60px 20px;
            border-top: 2px solid var(--ink);
            margin-top: 40px;
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .footer-text {
            font-size: 13px;
            color: var(--ink-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 640px) {
            .chapters-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .header {
                padding: 60px 0 50px;
            }
            .chapter-card {
                padding: 24px;
                box-shadow:
                    3px 3px 0 var(--ink),
                    6px 6px 0 rgba(0,0,0,0.05);
            }
            .card-title {
                font-size: 28px;
            }
        }

        @media (max-width: 400px) {
            .container { padding: 0 16px; }
            .chapter-card {
                padding: 20px;
                border-radius: 14px;
                box-shadow:
                    2px 2px 0 var(--ink),
                    4px 4px 0 rgba(0,0,0,0.05);
            }
            .card-icon {
                width: 46px;
                height: 46px;
                border-radius: 12px;
            }
            .card-icon svg { width: 26px; height: 26px; }
            .card-title { font-size: 24px; }
            .card-desc { font-size: 14px; margin-bottom: 18px; }
            .card-header { margin-bottom: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-number">Creole</div>
            <h1>异想<br>小站</h1>
            <p class="header-subtitle">
                一个数字玩具箱。<br>
                没什么目的，就是好玩。<br>
                往下滑，挑一个试试。
            </p>
            <div class="divider"></div>
        </div>

        <div class="chapters-grid">
            <a href="games.html" class="chapter-card">
                <div class="card-header">
                    <span class="card-number">Chapter 01</span>
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="2" width="18" height="4.5" rx="1"/>
                            <rect x="3" y="8" width="18" height="4.5" rx="1"/>
                            <line x1="9" y1="2" x2="9" y2="12.5"/>
                            <line x1="15" y1="2" x2="15" y2="12.5"/>
                            <rect x="7" y="19" width="10" height="2.5" rx="1.2"/>
                            <circle cx="12" cy="16.5" r="1.8" fill="white" stroke="none"/>
                        </svg>
                    </div>
                </div>
                <h2 class="card-title">游戏厅</h2>
                <p class="card-desc">
                    经典打砖块、2048、贪吃蛇、Simon Says……<br>
                    8 个小游戏，直接开玩。
                </p>
                <div class="card-footer">
                    <span class="card-tag">Chapter 01</span>
                    <div class="card-arrow">→</div>
                </div>
            </a>

            <a href="curio.html" class="chapter-card">
                <div class="card-header">
                    <span class="card-number">Chapter 02</span>
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <circle cx="12" cy="12" r="4"/>
                            <circle cx="12" cy="12" r="1.2" fill="white" stroke="none"/>
                        </svg>
                    </div>
                </div>
                <h2 class="card-title">数字奇物柜</h2>
                <p class="card-desc">
                    永恒时钟、数字占卜、记忆盒子、情绪色板……<br>
                    更小、更安静的数字物件。
                </p>
                <div class="card-footer">
                    <span class="card-tag">Chapter 02</span>
                    <div class="card-arrow">→</div>
                </div>
            </a>
        </div>

        <div class="footer">
            <div class="footer-logo">CREOLE</div>
            <p class="footer-text">异想小站 · 2026</p>
        </div>
    </div>
</body>
</html>
